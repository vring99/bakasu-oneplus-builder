name:  oplus-bakasu-pro-vring-snapdragon

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      BAKASU_VERSION:
        description: "BakaSU Pro version"
        required: false
        type: choice
        options:
          - "35275"
          - "35285"
          - "35295"
          - "35305"
        default: "35295"
      UNI:
        description: "启用 Unicode 绕过修复"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      BAKASU_VERSION:
        required: false
        type: string
        default: "35295"
      UNI:
        required: false
        type: boolean
        default: true


jobs:
  vring-bakasu-snapdragon:
    name: "${{ matrix.file }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: oneplus_ace2_pro_v
            sched: false
            ipv6: true

          - file: oneplus_ace3_b
            sched: false
            ipv6: true

          - file: oneplus_ace_6t_Canary
            sched: false
            ipv6: true
          - file: oneplus_15_Canary
            sched: false
            ipv6: true
          - file: oneplus_15t_Canary
            sched: false
            ipv6: true
          - file: oneplus_pad_4_Canary
            sched: false
            ipv6: true

          - file: oneplus_pad_3_pro_Canary
            sched: false
            ipv6: true




    uses: ./.github/workflows/build-kernel-original-make.yml
    secrets: inherit
    with:
      FILE: ${{ matrix.file }}
      BAKASU_VERSION: ${{ inputs.BAKASU_VERSION || '35295' }}
      UNI: ${{ inputs.UNI }}
      HOOK: "manual"
      SUSFS_CI: "CI"
      KSU_META: "susfs-main/vring/"
      BUILD_TIME:  "Mon Aug 18 09:30:24 UTC 2024"
      SCHED: ${{ matrix.sched }}
      ZRAM: false
      LSM: true
      FAST_BUILD: true
      IPV6: ${{ matrix.ipv6 }}
