name:  oplus-bakasu-pro-vring-snapdragon

on:
  workflow_dispatch:
    inputs:
      BAKASU_VERSION:
        description: "BakaSU Pro version"
        required: false
        type: choice
        options:
          - "35275"
          - "35285"
        default: "35275"
      UNI:
        description: "启用 Unicode 绕过修复"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      BAKASU_VERSION:
        required: false
        type: string
        default: "35275"
      UNI:
        required: false
        type: boolean
        default: true


jobs:
  vring-bakasu-snapdragon:
    name: "${{ matrix.file }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: oneplus_10t_v
            sched: false
            ipv6: true
          - file: oneplus_12_141
            sched: false
            ipv6: true
          - file: oneplus_13
            sched: true
            ipv6: true
          - file: oneplus_13t
            sched: true
            ipv6: true
          - file: oneplus_ace_6_89
            sched: true
            ipv6: true
          - file: oneplus_turbo_6
            sched: true
            ipv6: true

    uses: ./.github/workflows/build-kernel-original-make.yml
    secrets: inherit
    with:
      FILE: ${{ matrix.file }}
      BAKASU_VERSION: ${{ inputs.BAKASU_VERSION || '35275' }}
      UNI: ${{ inputs.UNI }}
      HOOK: "manual"
      SUSFS_CI: "CI"
      KSU_META: "susfs-main/vring/"
      BUILD_TIME:  "Mon Aug 18 09:30:24 UTC 2024"
      SCHED: ${{ matrix.sched }}
      ZRAM: false
      LSM: true
      FAST_BUILD: true
      IPV6: ${{ matrix.ipv6 }}
